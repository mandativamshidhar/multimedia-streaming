name: Deploy to Fly

on:
  push:
    branches: [ 'gh-pages' ]

env:
  FLY_APP: multimedia-streaming

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Fly secrets
        uses: superfly/flyctl-actions@v1
        with:
          args: "secrets set ADMIN_TOKEN=${{ secrets.ADMIN_TOKEN }} --app ${{ env.FLY_APP }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly
        uses: superfly/flyctl-actions@v1
        with:
          args: "deploy --config fly.toml --app ${{ env.FLY_APP }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
