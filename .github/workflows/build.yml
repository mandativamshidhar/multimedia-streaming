name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1
      with:
        cmake-version: '3.20.x'
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -A x64
    
    - name: Build
      run: |
        cd build
        cmake --build . --config Release
    
    - name: Run Demo
      run: |
        cd build
        .\bin\Release\streaming_app.exe
      timeout-minutes: 2
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: streaming_app-windows
        path: build/bin/Release/streaming_app.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ make
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Unix Makefiles"
    
    - name: Build
      run: |
        cd build
        cmake --build . -- -j$(nproc)
    
    - name: Run Demo
      run: |
        cd build
        timeout 5 ./bin/streaming_app || true
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: streaming_app-linux
        path: build/bin/streaming_app

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Dependencies
      run: |
        brew install cmake
    
    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -G "Unix Makefiles"
    
    - name: Build
      run: |
        cd build
        cmake --build . -- -j$(sysctl -n hw.logicalcpu)
    
    - name: Run Demo
      run: |
        cd build
        timeout 5 ./bin/streaming_app || true
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: streaming_app-macos
        path: build/bin/streaming_app

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v3
    
    - name: Download All Artifacts
      uses: actions/download-artifact@v3
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          streaming_app-windows/streaming_app.exe
          streaming_app-linux/streaming_app
          streaming_app-macos/streaming_app
        draft: false
        prerelease: false
