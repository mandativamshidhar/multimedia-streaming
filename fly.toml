app = "multimedia-streaming"
primary_region = "iad"

[build]
  # Use the Dockerfile in the repo
  image = "Dockerfile"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 2000
